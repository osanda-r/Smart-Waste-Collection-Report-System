<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 72" fill="none">
  <!-- Icon mark: rounded square with leaf + bin -->
  <g>
    <rect x="0" y="4" width="56" height="56" rx="16" fill="#052E16"/>
    <rect x="0" y="4" width="56" height="56" rx="16" fill="url(#g1)"/>
    <!-- Bin shape -->
    <g transform="translate(13,12)">
      <!-- bin body -->
      <path d="M15 8 C15 8 7 8 7 11 L7 13 L23 13 L23 11 C23 8 15 8 15 8Z" fill="white" fill-opacity="0.95"/>
      <path d="M9.5 15 L20.5 15 L19.2 29.5 C19.2 30.6 18.3 31.5 17.2 31.5 L12.8 31.5 C11.7 31.5 10.8 30.6 10.8 29.5 L9.5 15Z" fill="#DCFCE7"/>
      <!-- handle -->
      <path d="M12 8 C12 5.8 13.2 4 15 4 C16.8 4 18 5.8 18 8" stroke="white" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      <!-- leaf overlay -->
      <g transform="translate(2.5,16)">
        <path d="M10 16 C6 13.5 2 9.5 4.2 4.2 C7 1.8 11 0.5 14 2.8 C12.5 6.5 9.5 11 10 16Z" fill="#22C55E"/>
        <path d="M10 16 C10 12.2 11.8 7.5 14 2.8" stroke="#052E16" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" opacity="0.18"/>
        <path d="M7.2 9.2 C8.5 9 9.8 8.8 10.8 8.2" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.85"/>
      </g>
      <!-- bin lines -->
      <rect x="12.2" y="18" width="1.9" height="10" rx="0.95" fill="#16A34A" opacity="0.28"/>
      <rect x="15.9" y="18" width="1.9" height="10" rx="0.95" fill="#16A34A" opacity="0.28"/>
    </g>
    <!-- circular arrow hint -->
    <g opacity="0.92" transform="translate(28,5)">
      <path d="M8.5 -1 A15 15 0 0 1 18 6" stroke="white" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.95"/>
      <path d="M16.2 3.2 L18 6 L15 7.2" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>
  <!-- Wordmark -->
  <g font-family="Outfit, Plus Jakarta Sans, sans-serif">
    <text x="72" y="34" font-size="28.5" font-weight="800" letter-spacing="-0.03em" fill="#052E16">Eco<tspan fill="#15803D">Track</tspan></text>
    <text x="72.5" y="52.5" font-size="10.2" font-weight="700" letter-spacing="0.18em" fill="#5B7A6A">SMART WASTE COLLECTION</text>
    <rect x="72" y="58" width="168" height="2.2" rx="1.1" fill="#22C55E" opacity="0.9"/>
  </g>
  <defs>
    <linearGradient id="g1" x1="0" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14532D"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
  </defs>
</svg>
